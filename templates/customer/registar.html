{% extends 'customer/common/layout.html' %}
{% block content %}
{% load static %}
<title>Ad Release | Register</title>

<!-- Scripts -->
<script type="text/javascript" src="{% static 'customer/login1/js/jquery-3.6.2.min.js' %}"></script>
<script type="text/javascript" src="{% static 'customer/login1/js/bootstrap.min.js' %}"></script>

<script>
// Quotes
document.addEventListener('DOMContentLoaded', function () {
  const wiseQuotes = [
    "The best way to predict the future is to create it.",
    "Success is not the key to happiness. Happiness is the key to success.",
    "Do what you can, with what you have, where you are.",
    "Believe you can and you're halfway there.",
    "You miss 100% of the shots you don't take.",
    "Life is 10% what happens to us and 90% how we react to it."
  ];
  document.getElementById("wiseQuote").innerText = wiseQuotes[Math.floor(Math.random() * wiseQuotes.length)];
});

// Date Restriction
document.addEventListener('DOMContentLoaded', function () {
  const today = new Date().toISOString().split("T")[0];
  document.getElementById("dob").setAttribute("max", today);
});

// Image Preview
document.addEventListener('DOMContentLoaded', function () {
  const upload = document.getElementById('imageUpload');
  const preview = document.getElementById('imagePreview');

  upload.addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function (e) {
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  });

  preview.addEventListener('mouseenter', function () {
    preview.style.transform = 'scale(1.5)';
    preview.style.transition = 'transform 0.3s ease';
  });

  preview.addEventListener('mouseleave', function () {
    preview.style.transform = 'scale(1)';
  });
});

// Password Validation
function validatePassword() {
  const pass = document.getElementById('pass').value;
  const cpass = document.getElementById('cpass').value;
  const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

  if (!regex.test(pass)) {
    alert("Password must be strong:\n- 8+ characters\n- Uppercase\n- Lowercase\n- Number\n- Special Character");
    return false;
  }
  if (pass !== cpass) {
    alert("Passwords do not match!");
    return false;
  }
  return true;
}

document.addEventListener("DOMContentLoaded", function () {
  const form = document.querySelector('form');
  form.addEventListener('submit', function (e) {
    if (!validatePassword()) e.preventDefault();
  });
});
</script>

<!-- Styles -->
<style>
  .img1 {
    background-image: url("{% static 'customer/assets/img/a2.jpg' %}");
    background-size: cover;
    height: 100%;
    width: 100%;
    opacity: 0.8;
  }

  body {
    background-color: #fff;
  }

  .contact {
    background-color: #f1f1f1;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    height: 100%;
  }

  .contact:hover {
    transform: translateY(-5px);
    background-color: #e0e0e0;
  }

  .contact input, .contact select, .contact button {
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 15px;
    width: 100%;
  }

  .contact label {
    font-weight: bold;
    color: #333;
  }

  .contact button {
    background-color: #ff9800;
    color: white;
    border: none;
    cursor: pointer;
  }

  .contact button:hover {
    background-color: #e68900;
  }

  .breadcrumbs {
    background-color: #000;
    color: white;
  }

  .breadcrumbs a {
    color: #ff9800;
  }

  #wiseQuote {
    text-align: center;
    font-size: 1.3em;
    font-style: italic;
    color: #ff9800;
    margin-top: 20px;
  }

  .image-upload-container {
    text-align: center;
    margin-bottom: 20px;
  }

  #imagePreview {
    max-width: 100%;
    max-height: 200px;
    border-radius: 8px;
    margin-top: 10px;
    cursor: pointer;
  }

  .img2 {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
  }

  .col-lg-6 {
    flex: 1;
    padding: 10px;
    display: flex;
    align-items: stretch;
  }

  .col-lg-6 .contact {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
</style>

<main id="main">
  <div class="breadcrumbs d-flex align-items-center img1">
    <div class="container position-relative d-flex flex-column align-items-center">
      <h2>Register</h2>
      <ol>
        <li><a href="/customer/home">Home</a></li>
        <li>Register</li>
      </ol>
    </div>
  </div>

  <section id="contact" class="contact">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
          <button type="button" class="btn btn-secondary btn-sm ml-3" data-dismiss="alert">Cancel</button>
        </div>
      {% endfor %}
    {% endif %}
    <h3 class="text-warning text-center">Register To Become Our User !!!</h3>
    <div id="wiseQuote"></div>
    <br>
    <div class="container">

      <div class="row gy-4 mt-1 m-auto holediv">
        <div class="col-lg-6">
          <img src="{% static 'customer/assets/img/img2.jpg' %}" class="img2" alt="Register Image">
        </div>

        <div class="col-lg-6">
          <div class="contact">
            <form action="/customer/user_store" method="post" enctype="multipart/form-data">
              {% csrf_token %}
              <div class="row gy-4">
                <div class="col-lg-6 form-group">
                  <input type="text" name="fname" class="form-control" id="fname" placeholder="First Name" value="{{ request.session.dummy_fname|default:'' }}" required>
                </div>
                <div class="col-lg-6 form-group">
                  <input type="text" name="lname" class="form-control" id="lname" placeholder="Last Name" value="{{ request.session.dummy_lname|default:'' }}" required>
                </div>
                <div class="col-lg-12 form-group">
                  <input type="email" name="email" class="form-control" id="email" placeholder="Email" value="{{ request.session.dummy_email|default:'' }}" required>
                </div>
                <div class="col-lg-12 form-group">
                  <input type="text" name="username" class="form-control" id="username" placeholder="Username" value="{{ request.session.dummy_username|default:'' }}" required>
                </div>
                <div class="col-lg-12 form-group">
                  <input type="text" name="contactno" class="form-control" id="contactno" placeholder="Contact No" value="{{ request.session.dummy_contact|default:'' }}" required>
                </div>
                <div class="col-lg-6 form-group">
                  <select class="form-control" id="gender" name="gender">
                    <option value="">--Select Gender--</option>
                    <option value="male" {% if request.session.dummy_gender == 'male' %}selected{% endif %}>Male</option>
                    <option value="female" {% if request.session.dummy_gender == 'female' %}selected{% endif %}>Female</option>
                    <option value="other" {% if request.session.dummy_gender == 'other' %}selected{% endif %}>Other</option>
                  </select>
                </div>
                <div class="col-lg-6 form-group">
                  <input type="date" name="dob" class="form-control" id="dob" value="{{ request.session.dummy_dob|default:'' }}" required>
                </div>
                
                <div class="col-lg-12 form-group">
                  <textarea name="address" class="form-control" id="address" placeholder="Address" rows="3" required>{{ request.session.dummy_address|default:'' }}</textarea>
                </div>
                <div class="col-lg-12 form-group">
                  <input type="password" name="pass" class="form-control" id="pass" placeholder="Password" required>
                </div>
                <div class="col-lg-12 form-group">
                  <input type="password" name="cpass" class="form-control" id="cpass" placeholder="Confirm Password" required>
                </div>

                <div class="col-lg-12 form-group image-upload-container">
                  <label for="imageUpload">Upload Image</label>
                  <input type="file" name="image" id="imageUpload" class="form-control" accept="image/*">
                  <img id="imagePreview" style="display:none;" alt="Image Preview">
                </div>
              </div>
              <div class="text-center"><button type="submit">Register</button></div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </section>
</main>


<style>
  body {
    background: linear-gradient(to right, #ffffff, #f7f7f7);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .img1 {
    background-image: url("{% static 'customer/assets/img/a2.jpg' %}");
    background-size: cover;
    background-position: center;
    height: 100%;
    width: 100%;
    opacity: 0.8;
  }

  .breadcrumbs {
    background-color: rgba(0, 0, 0, 0.85);
    color: white;
    padding: 20px 0;
    text-align: center;
  }

  .breadcrumbs h2 {
    font-weight: bold;
    color: #ffc107;
    font-size: 2.2rem;
  }

  .breadcrumbs ol {
    padding-left: 0;
    list-style: none;
    margin-top: 10px;
  }

  .breadcrumbs ol li {
    display: inline;
    margin-right: 10px;
    color: #fff;
  }

  .breadcrumbs ol li a {
    color: #ffc107;
    text-decoration: none;
    transition: 0.3s;
  }

  .breadcrumbs ol li a:hover {
    text-decoration: underline;
  }

  #wiseQuote {
    text-align: center;
    font-size: 1.2rem;
    font-style: italic;
    color: #ff9800;
    margin-top: 20px;
    font-weight: 500;
  }

  .contact {
    background-color: #ffffff;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    transition: all 0.3s ease-in-out;
  }

  .contact:hover {
    transform: translateY(-6px);
    background-color: #fafafa;
  }

  .contact input,
  .contact select,
  .contact textarea {
    border-radius: 8px;
    padding: 14px;
    border: 1px solid #ccc;
    transition: border-color 0.3s;
  }

  .contact input:focus,
  .contact select:focus,
  .contact textarea:focus {
    border-color: #ff9800;
    box-shadow: none;
    outline: none;
  }

  .contact button {
    background-color: #ff9800;
    color: white;
    font-weight: bold;
    padding: 14px 30px;
    border: none;
    border-radius: 8px;
    transition: background-color 0.3s ease-in-out;
  }

  .contact button:hover {
    background-color: #e68900;
  }

  .image-upload-container label {
    font-weight: 600;
    color: #444;
  }

  #imagePreview {
    max-width: 150px;
    max-height: 150px;
    margin-top: 12px;
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    transition: transform 0.3s ease;
  }

  #imagePreview:hover {
    transform: scale(1.4);
    cursor: zoom-in;
  }

  .img2 {
    width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
  }

  .holediv {
    background-color: #fefefe;
    padding: 20px;
    border-radius: 12px;
  }

  .text-warning.text-center {
    font-size: 1.7rem;
    font-weight: bold;
    color: #d35400 !important;
    margin-bottom: 10px;
  }

  .alert-dismissible .btn-secondary {
    background: #6c757d;
    margin-left: 10px;
  }
</style>

{% endblock %}
